---
# Dev-only Redis for `duty run` and worktrees. Its own project name keeps it apart from
# compose.yaml's stack in this folder, and host port 6380 keeps it off the API's Redis on 6379.
name: valentina-web-dev

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    command: redis-server --save 20 1 --loglevel warning --requirepass redispassword
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - .dev/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "--no-auth-warning", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
    attach: false
